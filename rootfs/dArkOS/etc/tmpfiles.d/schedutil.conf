# schedutil re-evaluates the CPU frequency at most every rate_limit_us. The
# RK3326 switches in ~0.1 ms, so 2 ms instead of the 10 ms default lets the
# CPU follow load bursts in the menus. Applied again by perfnorm.
# Per policy on the BSP kernels, one global directory on mainline; a glob
# that matches nothing is skipped.
w /sys/devices/system/cpu/cpufreq/policy*/schedutil/rate_limit_us - - - - 2000
w /sys/devices/system/cpu/cpufreq/schedutil*/rate_limit_us - - - - 2000
