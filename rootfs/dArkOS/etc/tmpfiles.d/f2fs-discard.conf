# F2FS online discard, throttled for the SD card (only matters on an F2FS
# root mounted with discard; ss-trim lifts this while the ES screensaver runs)
# - no trims under 2 MiB: the card times out on small ones
w /sys/fs/f2fs/*/discard_granularity    - - - - 512
# - do not fall back to 4 KiB trims when the disk is over 80 % full
w /sys/fs/f2fs/*/discard_urgent_util    - - - - 100
# - at most one trim a minute
w /sys/fs/f2fs/*/max_discard_request    - - - - 1
w /sys/fs/f2fs/*/min_discard_issue_time - - - - 60000
w /sys/fs/f2fs/*/mid_discard_issue_time - - - - 60000
w /sys/fs/f2fs/*/max_discard_issue_time - - - - 60000
w /sys/fs/f2fs/*/discard_io_aware       - - - - 1
