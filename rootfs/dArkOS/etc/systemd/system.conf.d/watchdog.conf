[Manager]
# Hardware watchdog (the SoC's DesignWare WDT): if the kernel hangs and
# systemd stops feeding it, the board resets after about 20 s instead of
# staying frozen at full clocks. The kernel's own hard-lockup detector is
# not available here (no NMI on RK3326).
RuntimeWatchdogSec=20s
RebootWatchdogSec=1min
