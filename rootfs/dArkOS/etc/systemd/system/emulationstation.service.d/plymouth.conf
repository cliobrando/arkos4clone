# ES starts after plymouth is up, and plymouth stops painting before ES
# opens the display: deactivate freezes the splash's last frame in place
# (no black gap) and releases the display, so the two never draw at the
# same time (that overlap flickered the logo over ES's loading screen).
# ES still quits the deactivated daemon itself after its first frame.
# "+" runs it as root whatever User= the service has; "-" and the timeout
# keep a missing or stuck plymouth from blocking ES.
[Unit]
After=plymouth-start.service

[Service]
ExecStartPre=+-/usr/bin/timeout 5 /bin/plymouth deactivate
