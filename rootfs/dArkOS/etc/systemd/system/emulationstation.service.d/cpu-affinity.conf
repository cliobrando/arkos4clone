[Service]
# Keep ES and every game it launches off CPU0, which handles all hardware
# interrupts (joypad ADC, I2C, display, SD card, Wi-Fi). A game's
# emulation thread that lands there loses a few percent: Raiden 2 on FBNeo
# ran at 50-53 fps on CPU0 and 55 on CPUs 1-3 (R36 Ultra, 7.3 kernel).
CPUAffinity=1-3
