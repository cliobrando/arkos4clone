[Service]
# glibc 2.41 (Debian 13 point releases) no longer lets dlopen() make the stack
# executable, so 32-bit cores that ask for one fail to load: all pcsx_rearmed
# variants, fbneo 32-bit, flycast and nebularm. Restore the old behaviour for
# ES and the games it launches.
Environment=GLIBC_TUNABLES=glibc.rtld.execstack=2
