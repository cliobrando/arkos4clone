# The splash is no longer quit on a timer or target: EmulationStation stops
# and quits plymouth itself the moment its first frame is rendered (no black
# window between splash and UI). A watchdog in the emulationstation wrapper
# force-quits the splash after 45 s if ES fails to come up. Stock quits here
# raced ES's first frame and blotted it with black, so this unit is a no-op.
[Service]
ExecStart=
ExecStart=/bin/true
